name: Published npm and hosted API

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published npm version to test
        required: true
        default: "0.2.2"
        type: string
      prepare_release:
        description: Also build an npm release archive on a remote runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Test the public package against the deployed API
        env:
          OFFRAMP_NPM_VERSION: ${{ inputs.version }}
        run: node scripts/smoke-published.mjs

  release_archive:
    if: inputs.prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Build and inspect the release archive
        run: |
          mkdir -p "$RUNNER_TEMP/offramp-release"
          npm pack --json --pack-destination "$RUNNER_TEMP/offramp-release" > "$RUNNER_TEMP/offramp-release/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [pack] = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'offramp-release', 'pack.json'), 'utf8'));
          assert(pack.files.some(file => file.path === 'docs/prompts.md'));
          for (const file of pack.files) {
            assert(/^(dist\/|docs\/|package\.json$|\.env\.example$|README\.md$|CONTRIBUTING\.md$|LICENSE$)/.test(file.path), file.path);
          }
          console.log(JSON.stringify({ version: pack.version, shasum: pack.shasum, bytes: pack.size, files: pack.files.length }));
          NODE
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/offramp-release/*.tgz
          if-no-files-found: error
          retention-days: 7
